services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: closedai
      POSTGRES_PASSWORD: closedai
      POSTGRES_USER: closedai
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closedai -d closedai"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - closedai-postgres:/var/lib/postgresql/data

volumes:
  closedai-postgres:
